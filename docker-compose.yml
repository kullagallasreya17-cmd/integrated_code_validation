services:
  # ---- Sreya's services (active) ----

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coding_validation}
      POSTGRES_USER: ${POSTGRES_USER:-coding_validation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_ORCHESTRATOR_URL=http://orchestrator:8000
      - GATEWAY_QUALITY_SERVICE_URL=http://code-quality:8000
      - GATEWAY_SECURITY_SERVICE_URL=http://security:8000
      - GATEWAY_REPAIR_SERVICE_URL=http://repair:8000
      - GATEWAY_SANDBOX_SERVICE_URL=http://sandbox:8004
      - GATEWAY_VALIDATION_SERVICE_URL=http://validation:8000
      - GATEWAY_BUG_RESOURCE_SERVICE_URL=${ORCH_BUG_RESOURCE_SERVICE_URL:-http://bug-resource:8000}
      - GATEWAY_REPORT_RECOMMENDATION_SERVICE_URL=http://report-recommendation:8000
      - GATEWAY_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-coding_validation}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}@postgres:5432/${POSTGRES_DB:-coding_validation}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173}
      - GATEWAY_AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - GATEWAY_LOCAL_DEMO_AUTH_ENABLED=${LOCAL_DEMO_AUTH_ENABLED:-false}
      - GATEWAY_BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - GATEWAY_BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - GATEWAY_BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-System Administrator}
    depends_on:
      orchestrator:
        condition: service_started
      postgres:
        condition: service_healthy
      bug-resource:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  report-recommendation:
    build:
      context: .
      dockerfile: services/report-recommendation-service/Dockerfile
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator-service/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8000"
    environment:
      - ORCH_QUALITY_SERVICE_URL=http://code-quality:8000
      - ORCH_SECURITY_SERVICE_URL=http://security:8000
      - ORCH_BUG_RESOURCE_SERVICE_URL=${ORCH_BUG_RESOURCE_SERVICE_URL:-http://bug-resource:8000}
      - ORCH_REPAIR_SERVICE_URL=http://repair:8000
      - ORCH_SANDBOX_SERVICE_URL=http://sandbox:8004
      - ORCH_VALIDATION_SERVICE_URL=http://validation:8000
      - ORCH_REPORT_RECOMMENDATION_SERVICE_URL=http://report-recommendation:8000
      - ORCH_AI_REPORT_TIMEOUT_SECONDS=150
      - ORCH_RUN_STORE_PATH=/service/data/workflow-runs.json
    depends_on:
      code-quality:
        condition: service_started
      security:
        condition: service_started
      bug-resource:
        condition: service_healthy
      repair:
        condition: service_started
      sandbox:
        condition: service_started
      validation:
        condition: service_started
      report-recommendation:
        condition: service_healthy
    volumes:
      - orchestrator-data:/service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  code-quality:
    build:
      context: .
      dockerfile: services/code-quality-service/Dockerfile
    ports:
      - "${QUALITY_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  security:
    build:
      context: .
      dockerfile: services/security_service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  bug-resource:
    build:
      context: .
      dockerfile: services/bug-resource-service/Dockerfile
    ports:
      - "${BUG_RESOURCE_PORT:-8005}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  repair:
    build:
      context: .
      dockerfile: services/repair-service/Dockerfile
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:${OLLAMA_HOST_PORT:-11434}/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sandbox:
    build:
      context: ./services/sandbox_service
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-workspaces:/sandbox-workspaces
    environment:
      - SANDBOX_WORKSPACE_ROOT=/sandbox-workspaces
      - SANDBOX_WORKSPACE_VOLUME=${COMPOSE_PROJECT_NAME:-coding-validation-agent-frontend}_sandbox-workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  validation:
    build:
      context: .
      dockerfile: services/validation_service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:8000}"
        VITE_LOCAL_DEMO_AUTH: "${LOCAL_DEMO_AUTH_ENABLED:-false}"
    ports:
      - "${FRONTEND_PORT:-5174}:8080"
    environment:
      - VITE_API_BASE_URL=${FRONTEND_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - gateway

volumes:
  orchestrator-data:
  postgres-data:
  sandbox-workspaces:
    name: ${COMPOSE_PROJECT_NAME:-coding-validation-agent-frontend}_sandbox-workspaces
