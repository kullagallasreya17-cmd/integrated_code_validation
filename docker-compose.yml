services:
  # ---- Sreya's services (active) ----

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coding_validation}
      POSTGRES_USER: ${POSTGRES_USER:-coding_validation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_ORCHESTRATOR_URL=http://orchestrator:8000
      - GATEWAY_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-coding_validation}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}@postgres:5432/${POSTGRES_DB:-coding_validation}
    depends_on:
      orchestrator:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator-service/Dockerfile
    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8000"
    environment:
      - ORCH_QUALITY_SERVICE_URL=http://code-quality:8000
      - ORCH_SECURITY_SERVICE_URL=http://security:8000
      - ORCH_BUG_RESOURCE_SERVICE_URL=${ORCH_BUG_RESOURCE_SERVICE_URL:-}
      - ORCH_REPAIR_SERVICE_URL=http://repair:8000
      - ORCH_SANDBOX_SERVICE_URL=http://sandbox:8004
      - ORCH_VALIDATION_SERVICE_URL=http://validation:8000
      - ORCH_RUN_STORE_PATH=/service/data/workflow-runs.json
    depends_on:
      - code-quality
      - security
      - repair
      - sandbox
      - validation
    volumes:
      - orchestrator-data:/service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  code-quality:
    build:
      context: .
      dockerfile: services/code-quality-service/Dockerfile
    ports:
      - "${QUALITY_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  security:
    build:
      context: .
      dockerfile: services/security_service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  repair:
    build:
      context: .
      dockerfile: services/repair-service/Dockerfile
    environment:
      - OLLAMA_HOST_PORT=${OLLAMA_HOST_PORT:-11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  sandbox:
    build:
      context: ./services/sandbox_service
      dockerfile: Dockerfile
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  validation:
    build:
      context: .
      dockerfile: services/validation_service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:8000}"
        VITE_LOCAL_DEMO_AUTH: "${FRONTEND_LOCAL_DEMO_AUTH:-true}"
    ports:
      - "${FRONTEND_PORT:-5174}:8080"
    environment:
      - VITE_API_BASE_URL=${FRONTEND_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - gateway

volumes:
  orchestrator-data:
  postgres-data:
